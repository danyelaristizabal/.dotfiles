# Application bindings
$terminal = uwsm app -- $TERMINAL
$browser = omarchy-launch-browser

# most used apps 
 
unbind = SUPER, V
bindd = SUPER, N, Notion, exec, ~/.local/bin/focusOrLaunch.sh Notion notion-app 
bindd = SUPER, RETURN, Terminal, exec, ~/.local/bin/focusOrLaunch.sh org.wezfurlong.wezterm wezterm
bind = SUPER, B, exec, ~/.local/bin/focusOrLaunch.sh Bitwarden bitwarden-desktop
bind = SUPER, V, exec, ~/.local/bin/focusOrLaunch.sh vivaldi-stable vivaldi
bind = SUPER SHIFT, V, exec, ~/.local/bin/focusOrLaunch.sh virt-manager virt-manager  
bindd = SUPER SHIFT, S, Music, exec, uwsm app -- spotify


# tuis 
bindd = SUPER SHIFT, F, Files, exec, ~/.local/bin/focusOrLaunchTui.sh "Yazi:" "Alacritty" alacritty -t "Yazi: ~/" -e yazi

bindd = SUPER SHIFT, B, Monitoring, exec, ~/.local/bin/focusOrLaunchTui.sh "Btop:" "Alacritty" alacritty -t "Btop: ~/" -e btop 


# windows management 
bind = SUPER SHIFT, M, exec, ~/.local/bin/moveToEmptyWs.sh 
bind = SUPER SHIFT CTRL, M, movetoworkspace, special
bind = SUPER SHIFT ALT, M, togglespecialworkspace

# most used webapps 
bind = SUPER, C, exec, ~/.local/bin/focusOrLaunchWeb.sh "https://chatgpt.com"
bind = SUPER SHIFT, W, exec, ~/.local/bin/focusOrLaunchWeb.sh  "https://web.whatsapp.com/"
bind = SUPER SHIFT, T, exec, ~/.local/bin/focusOrLaunchWeb.sh "https://web.telegram.org/"

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER SHIFT, Space
# bindd = SUPER SHIFT, SPACE, Omarchy menu, exec, omarchy-menu
