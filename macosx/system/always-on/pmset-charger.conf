# Power settings for when the Mac is on the charger (applied with `pmset -c`).
# Battery settings are left untouched. Format: <pmset key> <value>  # comment
# Applied idempotently by setup_always_on in macosx/install.sh.

sleep          0    # never system-sleep on the charger
disksleep      0    # keep disks spinning/awake
displaysleep   10   # the screen can still turn off after 10 min
womp           1    # wake for network access
tcpkeepalive   1    # keep network connections alive
powernap       1    # background tasks (mail, iCloud, updates) keep running
ttyskeepawake  1    # an open remote terminal session (ssh) keeps it awake
autorestart    1    # power back on after a power cut, where the Mac supports it
